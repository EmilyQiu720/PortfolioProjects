<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#eef3f8"/>
  <rect x="0" y="0" width="1600" height="112" fill="#0f172a"/>
  <text x="44" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="700" fill="#ffffff">Production ML Risk Scoring API</text>
  <text x="44" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#cbd5e1">FastAPI model-serving backend with strict contracts, authenticated scoring, durable logs, and drift utilities</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="44" y="144" width="1512" height="92" rx="8" fill="#ffffff" stroke="#d7e0ea"/>
    <text x="72" y="180" font-size="18" font-weight="700" fill="#475569">Runtime Contracts</text>
    <rect x="72" y="196" width="220" height="26" rx="5" fill="#e7f6f3"/><text x="90" y="215" font-size="14" fill="#0f766e">POST /v1/score</text>
    <rect x="316" y="196" width="220" height="26" rx="5" fill="#e7f6f3"/><text x="334" y="215" font-size="14" fill="#0f766e">POST /v1/batch-score</text>
    <rect x="560" y="196" width="220" height="26" rx="5" fill="#fff4d8"/><text x="578" y="215" font-size="14" fill="#8a5a10">GET /v1/model</text>
    <rect x="804" y="196" width="220" height="26" rx="5" fill="#fde8ef"/><text x="822" y="215" font-size="14" fill="#be123c">POST /v1/drift</text>
    <rect x="1048" y="196" width="220" height="26" rx="5" fill="#edf2ff"/><text x="1066" y="215" font-size="14" fill="#4f46e5">X-API-Key auth</text>
    <rect x="1292" y="196" width="220" height="26" rx="5" fill="#f8fafc"/><text x="1310" y="215" font-size="14" fill="#475569">Pydantic schemas</text>

    <rect x="44" y="282" width="450" height="450" rx="8" fill="#ffffff" stroke="#d7e0ea"/>
    <text x="72" y="324" font-size="25" font-weight="700" fill="#1f2937">API Boundary</text>
    <text x="72" y="354" font-size="15" fill="#64748b">External clients send validated transaction features.</text>

    <rect x="76" y="392" width="386" height="96" rx="8" fill="#f8fafc" stroke="#d7e0ea"/>
    <text x="98" y="423" font-size="16" font-weight="700" fill="#334155">Request Validation</text>
    <text x="98" y="453" font-size="14" fill="#64748b">Feature schema, ranges, enums, missing fields</text>
    <text x="98" y="475" font-size="14" fill="#64748b">reject malformed inputs before model runtime</text>

    <rect x="76" y="520" width="386" height="96" rx="8" fill="#f8fafc" stroke="#d7e0ea"/>
    <text x="98" y="551" font-size="16" font-weight="700" fill="#334155">Security Controls</text>
    <text x="98" y="581" font-size="14" fill="#64748b">API key authentication, masked customer IDs</text>
    <text x="98" y="603" font-size="14" fill="#64748b">structured errors and environment config</text>

    <rect x="76" y="648" width="386" height="48" rx="8" fill="#111827"/>
    <text x="98" y="678" font-family="Consolas, monospace" font-size="15" fill="#d1d5db">{ "decision": "manual_review", "risk_score": 0.57 }</text>

    <rect x="574" y="282" width="452" height="450" rx="8" fill="#ffffff" stroke="#d7e0ea"/>
    <text x="602" y="324" font-size="25" font-weight="700" fill="#1f2937">Model Serving Pipeline</text>
    <text x="602" y="354" font-size="15" fill="#64748b">Deterministic runtime modules shared by API and batch jobs.</text>

    <rect x="626" y="394" width="348" height="56" rx="8" fill="#e7f6f3" stroke="#b7e1d9"/>
    <text x="652" y="429" font-size="16" font-weight="700" fill="#0f766e">Feature Transformer</text>
    <line x1="800" y1="450" x2="800" y2="486" stroke="#94a3b8" stroke-width="3"/>
    <polygon points="800,502 790,486 810,486" fill="#94a3b8"/>

    <rect x="626" y="502" width="348" height="56" rx="8" fill="#edf2ff" stroke="#c7d2fe"/>
    <text x="652" y="537" font-size="16" font-weight="700" fill="#4f46e5">Model Runtime</text>
    <line x1="800" y1="558" x2="800" y2="594" stroke="#94a3b8" stroke-width="3"/>
    <polygon points="800,610 790,594 810,594" fill="#94a3b8"/>

    <rect x="626" y="610" width="348" height="56" rx="8" fill="#fff4d8" stroke="#f1d58d"/>
    <text x="652" y="645" font-size="16" font-weight="700" fill="#8a5a10">Threshold Decision Policy</text>

    <rect x="1070" y="282" width="486" height="450" rx="8" fill="#ffffff" stroke="#d7e0ea"/>
    <text x="1098" y="324" font-size="25" font-weight="700" fill="#1f2937">Persistence and Monitoring</text>
    <text x="1098" y="354" font-size="15" fill="#64748b">Operational artifacts stay outside the prompt and model code.</text>

    <rect x="1102" y="392" width="404" height="82" rx="8" fill="#f8fafc" stroke="#d7e0ea"/>
    <text x="1124" y="424" font-size="16" font-weight="700" fill="#334155">SQLite Prediction Log</text>
    <text x="1124" y="452" font-size="14" fill="#64748b">request id, timestamp, score, decision, top factors</text>

    <rect x="1102" y="500" width="404" height="82" rx="8" fill="#f8fafc" stroke="#d7e0ea"/>
    <text x="1124" y="532" font-size="16" font-weight="700" fill="#334155">Model Registry JSON</text>
    <text x="1124" y="560" font-size="14" fill="#64748b">active version, coefficients, thresholds, metrics</text>

    <rect x="1102" y="608" width="404" height="82" rx="8" fill="#f8fafc" stroke="#d7e0ea"/>
    <text x="1124" y="640" font-size="16" font-weight="700" fill="#334155">PSI Drift Report</text>
    <text x="1124" y="668" font-size="14" fill="#64748b">reference vs current feature distributions</text>

    <line x1="494" y1="506" x2="574" y2="506" stroke="#64748b" stroke-width="4"/>
    <polygon points="574,506 558,496 558,516" fill="#64748b"/>
    <line x1="1026" y1="506" x2="1070" y2="506" stroke="#64748b" stroke-width="4"/>
    <polygon points="1070,506 1054,496 1054,516" fill="#64748b"/>

    <rect x="44" y="774" width="1512" height="82" rx="8" fill="#0f172a"/>
    <text x="72" y="807" font-size="16" font-weight="700" fill="#ffffff">Senior engineering signal</text>
    <text x="72" y="835" font-size="15" fill="#cbd5e1">Versioned REST API | reusable feature contract | online and batch inference | audit logging | drift utilities | Docker packaging | unit-tested service modules</text>
  </g>
</svg>
